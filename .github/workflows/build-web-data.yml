name: Build web data
on:
  push:
    branches: [main]
    paths: ["data/MY_HI_AWARD_DATA.xlsx"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build planner JSON
        run: python tools/build_planner_json.py
      - name: Commit generated web data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/planners data/meta.json
          if git diff --cached --quiet; then echo "No web-data changes."; else git commit -m "Auto-build HI-AWARD data [skip ci]" && git push; fi
