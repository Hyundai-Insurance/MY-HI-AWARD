name: Build & deploy MY HI-AWARD

on:
  push:
    branches: [main]
    paths:
      - 'data/MY_HI_AWARD_DATA.xlsx'
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'js/**'
      - 'images/**'
      - 'tools/build_planner_json.py'
      - '.github/workflows/build-web-data.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build planner JSON from Excel
        run: python tools/build_planner_json.py

      - name: Validate critical planner codes
        run: python tools/validate_planner_data.py

      - name: Prepare Pages site
        shell: bash
        run: |
          rm -rf _site
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            --exclude 'tools/' \
            --exclude 'RESET_ONCE.bat' \
            --exclude '업데이트방법.txt'
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
